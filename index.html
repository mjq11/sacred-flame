<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sacred Flame — Choose Your Path</title>
  <meta name="description" content="Online prayer platform for Christians and Buddhists. Light candles or burn incense — wherever you are.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#0a0a12;color:#ede5d8;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
    .bg{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(74,63,138,0.12) 0%,transparent 60%),radial-gradient(ellipse at 30% 70%,rgba(201,169,110,0.08) 0%,transparent 50%),#0a0a12;z-index:0}
    .content{position:relative;z-index:1;text-align:center;padding:2rem}
    h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2.5rem,7vw,4.5rem);font-weight:700;background:linear-gradient(135deg,#e8c97a,#c9a96e,#f5e6c8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.5rem;letter-spacing:2px}
    .tagline{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-style:italic;color:#8a8290;margin-bottom:2.5rem}
    .cards{display:flex;gap:2.5rem;flex-wrap:wrap;justify-content:center}
    .card{position:relative;width:300px;padding:3rem 2rem;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.08);border-radius:24px;text-align:center;transition:all .4s cubic-bezier(.25,.46,.45,.94);overflow:hidden;text-decoration:none;color:inherit;cursor:pointer}
    .card:hover{transform:translateY(-10px);box-shadow:0 25px 60px rgba(0,0,0,.4)}
    .card-christian:hover{border-color:rgba(100,120,200,.5);box-shadow:0 25px 60px rgba(74,63,138,.2)}
    .card-buddhist:hover{border-color:rgba(201,169,110,.5);box-shadow:0 25px 60px rgba(201,169,110,.15)}
    .card-glow{position:absolute;top:-60%;left:-60%;width:220%;height:220%;border-radius:50%;opacity:0;transition:opacity .5s}
    .card:hover .card-glow{opacity:1}
    .glow-c{background:radial-gradient(circle,rgba(74,63,138,.15),transparent 55%)}
    .glow-b{background:radial-gradient(circle,rgba(201,169,110,.12),transparent 55%)}
    .card-icon{font-size:4rem;margin-bottom:1.2rem}
    .card h2{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:700;margin-bottom:.4rem}
    .card-christian h2{color:#a8b4e8}
    .card-buddhist h2{color:#e8c97a}
    .card p{font-size:.9rem;color:#8a8290;margin-bottom:1.2rem;line-height:1.5}
    .card-btn{display:inline-block;padding:.6rem 1.8rem;border-radius:25px;font-size:.9rem;font-weight:600;transition:all .3s}
    .card-christian .card-btn{border:1px solid rgba(100,120,200,.4);color:#a8b4e8}
    .card-christian:hover .card-btn{background:rgba(100,120,200,.15)}
    .card-buddhist .card-btn{border:1px solid rgba(201,169,110,.4);color:#e8c97a}
    .card-buddhist:hover .card-btn{background:rgba(201,169,110,.1)}
    .footer{position:fixed;bottom:1.5rem;font-size:.75rem;color:#555;z-index:1}
    @media(max-width:680px){.cards{flex-direction:column;align-items:center}.card{width:90%;max-width:340px}}
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="content">
    <h1>Sacred Flame</h1>
    <p class="tagline">Choose your path of prayer</p>
    <div class="cards">
      <a href="christian/" class="card card-christian">
        <div class="card-glow glow-c"></div>
        <div class="card-icon">✝️</div>
        <h2>Sacred Light</h2>
        <p>Light a candle, read Scripture, and offer your prayer to the Lord.</p>
        <span class="card-btn">Enter →</span>
      </a>
      <a href="buddhist/" class="card card-buddhist">
        <div class="card-glow glow-b"></div>
        <div class="card-icon">☸️</div>
        <h2>心香殿</h2>
        <p>虔诚上香，求签问卦，为远方亲人祈福保平安。</p>
        <span class="card-btn">进入 →</span>
      </a>
    </div>
  </div>
  <div class="footer">© 2026 Sacred Flame · For spiritual comfort only</div>
</body>
</html>
